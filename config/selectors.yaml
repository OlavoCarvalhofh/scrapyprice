# Fallback de seletores CSS por domínio.
#
# Só é usado quando o site NÃO expõe dado estruturado (JSON-LD/OG/microdata),
# ou para completar campos que o structured não traz (ex: preço "de", parcelas).
#
# Como descobrir o seletor: abra a página no navegador > F12 (DevTools) >
# clique com o botão direito no elemento do preço > "Copiar seletor".
# Use "::text" no fim para pegar só o texto, ou "::attr(content)" para atributos.
#
# A chave é o domínio EXATO (o que aparece depois de https:// e antes da primeira /).
#
# ---- EXEMPLO (ajuste aos sites reais que você for monitorar) ----
#
# loja.exemplo.com.br:
#   preco: "span.price-now::text"
#   preco_de: "span.price-old::text"
#   produto: "h1.product-title::text"
#   disponibilidade: "div.stock-status::text"
#
# Deixe vazio se todos os seus sites expõem dado estruturado (o caso mais comum).

www.loja.tratorlin.com.br:
  preco: "span.product-big-price::text"
  preco_de: "span.product-scratched-price::text"
  preco_a_vista: "span.desconto_avista::text"
  produto: "h1.product-name::text"
  disponibilidade: "[itemprop='availability']::attr(href)"

www.prosperadistribuicao.com.br:
  preco: "[itemprop='price']::attr(content)"
  produto: "h3.nome_produto::text"
  disponibilidade: "[itemprop='availability']::attr(content)"

goldrones.com.br:
  # WooCommerce (Elementor) sem JSON-LD/OG/microdata nenhum -- nem preço
  # aparece em dado estruturado, só em HTML puro (mais o data layer do
  # plugin "Pixel Manager for WooCommerce" em JS solto, sem usar aqui).
  # #woo-custom-installments-product-price é o ID único do bloco de preço
  # do produto principal (nunca aparece nos cards de "relacionados"),
  # cobre os dois formatos: com promoção (<del>/<ins>) e sem (<span> direto)
  preco: "#woo-custom-installments-product-price ins .woocommerce-Price-amount bdi::text, #woo-custom-installments-product-price > span.woocommerce-Price-amount bdi::text"
  preco_de: "#woo-custom-installments-product-price del .woocommerce-Price-amount bdi::text"
  produto: "h1.product_title::text"
  # o wrapper do Elementor pro template de produto único carrega a classe
  # de estoque (instock/outofstock) do WooCommerce -- só aparece uma vez
  # por página (os cards de "relacionados" usam outro marcador HTML)
  disponibilidade: "div[data-elementor-type='product']::attr(class)"
