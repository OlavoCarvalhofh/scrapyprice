# Registro central de todos os sites monitorados.
# Rode qualquer um com: python scripts/sync_site.py --site <chave>
#
# Campos:
#   metodo:
#     vtex        -> site VTEX, usa a API pública de catálogo (scripts/sync_vtex_brand.py)
#     scrapy      -> site comum, usa o spider padrão (crawler/spiders/price_spider.py)
#                    com a lista de URLs filtrada a partir do sitemap
#     html_bulk   -> site que bloqueia o Scrapy (impressão digital do Twisted),
#                    usa requests puro (scripts/sync_html_bulk.py)
#     itemlist_bulk -> página lista vários produtos de uma vez (JSON-LD ItemList,
#                    ex: catálogo por veículo compatível), usa requests puro
#                    (scripts/sync_itemlist_bulk.py)
#   domain: URL base do site (sem barra no final)
#   marca: (só method=vtex) slug da marca no VTEX; omitir = catálogo inteiro
#   busca: (só method=vtex, alternativa a marca) lista de termos de busca livre
#          (map=ft) -- usar quando o site não marca produtos com atributo de
#          marca específico (ex: loja generalista que também vende peça de trator)
#   filtro: lista de termos -- só processa produtos que batem em pelo menos um
#           (omitir = catálogo inteiro, só usado em html_bulk/scrapy)
#   filtro_modo: (só method=scrapy)
#     url     (padrão) -- filtra pelo texto da própria URL do produto (rápido)
#     titulo  -- abre cada página e olha nome/marca do JSON-LD antes de decidir
#                (mais lento, necessário quando a URL não reflete a marca --
#                 ex: newpecasoficial usa slugs curtos tipo "/porca")

# ---- VTEX ----

agrotrator:
  metodo: vtex
  domain: https://www.agrotrator.com.br
  marca: cnh

fornecedoramaquinas:
  metodo: vtex
  domain: https://www.fornecedoramaquinas.com.br
  # loja 100% Case -- sem marca aqui = extrai o catálogo inteiro

fornecedoraagro:
  metodo: vtex
  domain: https://www.fornecedoraagro.com.br
  # loja 100% New Holland/CNH -- sem marca aqui = extrai o catálogo inteiro

carpaltratores:
  metodo: vtex
  domain: https://loja.carpaltratores.com.br
  # loja 100% CNH (confirmado pelo usuário), 166.612 produtos -- sem marca = catálogo inteiro

pitstop:
  metodo: vtex
  domain: https://www.pitstop.com.br
  # loja generalista de autopeças (280 mil produtos) -- marca "case" só tem 1 item,
  # usa busca por texto livre em vez de marca (map=ft)
  busca: ["new holland", "case ih", "trator case"]

# ---- Scrapy (spider padrão + filtro por URL) ----

tratorlin:
  metodo: scrapy
  domain: https://www.loja.tratorlin.com.br
  filtro: [case, new-holland]

realtrator:
  metodo: scrapy
  domain: https://realtrator.com.br
  filtro: [case, new-holland, newholland, cnh]
  # robots.txt tem "Disallow: /produto/", mas as URLs de produto de verdade
  # não usam esse prefixo (ficam em /pecas-para-X/<slug>), então não é
  # afetado -- ROBOTSTXT_OBEY permite normal. Catálogo enorme (6482 URLs,
  # 13 páginas de sitemap), generalista multi-marca (Massey Ferguson, JCB,
  # Valtra, Case, New Holland...) -- 1367 batem no filtro CNH. Microdata
  # pronta, sem seletor CSS. Rodada grande (~3h no delay padrão do scrapy)

acamargo:
  metodo: scrapy
  domain: https://www.acamargo.com
  filtro: [cnh, "-case-", new-holland, newholland, "-nh-"]

superagrosc:
  metodo: scrapy
  domain: https://www.superagrosc.com.br
  filtro: [case, new-holland, newholland]

tratormag:
  metodo: scrapy
  domain: https://tratormag.com.br
  filtro: [case, new-holland, newholland, cnh]

jerdrones:
  metodo: scrapy
  domain: https://jerdrones.com.br
  # loja de drones (concorrente do projeto de drones, não trator) -- 420
  # produtos, sem filtro de marca = catálogo inteiro (marca não é dimensão
  # relevante em drone)

goldrones:
  metodo: scrapy
  domain: https://goldrones.com.br
  filtro: ["/produto/"]
  # WordPress/WooCommerce -- o sitemap índice (wp-sitemap.xml) lista posts,
  # páginas, taxonomias e até usuários junto dos produtos, então o filtro
  # por URL restringe só ao que importa. robots.txt permissivo (sem bloqueio
  # de bot), então method=scrapy funciona normal, diferente do agripecas/
  # premierdrones. Sem JSON-LD/OG/microdata -- seletores CSS em
  # config/selectors.yaml (preço/produto/disponibilidade). Loja de drones
  # agrícolas DJI Agras (concorrente do projeto de drones), 300 produtos,
  # sem filtro de marca = catálogo inteiro

prosperadistribuicao:
  metodo: scrapy
  domain: https://www.prosperadistribuicao.com.br
  # catálogo pequeno (~140 urls, ~130 sem contar blog) -- sem filtro, roda tudo.
  # ~62 urls são página de blog/categoria sem preço (warning "sem preço", inofensivo)

# ---- Scrapy (filtro por título/marca -- URL não indica marca nesse site) ----

newpecasoficial:
  metodo: scrapy
  domain: https://www.newpecasoficial.com.br
  filtro: [cnh, case, "new holland", "new holand"]
  filtro_modo: titulo

# ---- HTML bulk (Scrapy bloqueado, usa requests puro) ----

agripecas:
  metodo: html_bulk
  domain: https://www.agripecas.net
  filtro: [case, new-holland, cnh]
  delay: 10
  # plataforma "Loja Integrada" (awsli); robots.txt tem um bloco específico
  # "User-agent: Scrapy" com Disallow: / (junto com vários outros bots
  # conhecidos), então method=scrapy ficaria bloqueado -- html_bulk não passa
  # pelo RobotsTxtMiddleware do Scrapy. O grupo "User-agent: *" (que cobre
  # nosso UA de navegador comum) permite tudo com Crawl-delay: 10, respeitado
  # aqui via "delay". Catálogo pequeno (347 produtos, 16 batem no filtro CNH
  # -- peças de plataforma de colheitadeira). Microdata (schema.org Product/
  # Offer) já traz produto/sku/preço prontos, sem precisar de seletor CSS

premierdrones:
  metodo: html_bulk
  domain: https://www.premierdrones.com.br
  delay: 10
  # mesma plataforma "Loja Integrada" (awsli) do agripecas, mesmo bloco
  # "User-agent: Scrapy" -> Disallow: / no robots.txt -- mesmo motivo de
  # usar html_bulk + delay:10. Loja de drones (concorrente do projeto de
  # drones, não trator, como o jerdrones) -- 343 produtos, sem filtro de
  # marca = catálogo inteiro. Microdata igual ao agripecas, sem seletor CSS

geotrackconsultoria:
  metodo: html_bulk
  domain: https://www.geotrackconsultoria.com.br
  filtro: [drone, dji, agras, pulverizador, jt40, jt50, jt20, jt10]
  delay: 10
  # mesma plataforma "Loja Integrada" (awsli), mesmo bloco robots.txt --
  # html_bulk + delay:10 pelo mesmo motivo do agripecas/premierdrones.
  # Loja GENERALISTA de topografia/geo (GPS, estação total, prisma, tripé)
  # que também vende drones DJI e drones pulverizadores agrícolas (JT10L/
  # JT20L/JT40L/JT50L) -- diferente do jerdrones/premierdrones (100% drone),
  # aqui precisa filtro pra não trazer equipamento de topografia. 244
  # produtos no catálogo, 48 batem no filtro. Microdata igual aos outros
  # dois "Loja Integrada", sem seletor CSS

worldwidebrasil:
  metodo: html_bulk
  domain: https://www.worldwidebrasil.com.br
  filtro: ["dji-", "-dji", drone, mavic, agras, phantom, avata, matrice, chasing, autel]
  delay: 10
  # mesma plataforma "Loja Integrada" (awsli), mesmo bloco robots.txt --
  # html_bulk + delay:10. Loja GENERALISTA de produtos importados/eletrônicos
  # (RC cars, celulares, câmeras, consoles, perfumes...) que também é um
  # revendedor grande da linha DJI completa (Agras T10 a T50, Matrice,
  # Mavic/Air/Mini/Avata, Chasing submarino, Autel) -- 1168 produtos no
  # catálogo, 171 batem no filtro. "dji-"/"-dji" (não "dji" sozinho) evita
  # falso positivo com "kurkdjian" (marca de perfume) casando a substring
  # "dji". Microdata igual aos outros "Loja Integrada", sem seletor CSS

dronedireto:
  metodo: html_bulk
  domain: https://www.dronedireto.com.br
  delay: 10
  # mesma plataforma "Loja Integrada" (awsli), mesmo bloco robots.txt --
  # html_bulk + delay:10. Loja especializada em drone/mapeamento aéreo
  # profissional (DJI enterprise: Matrice, Zenmuse, Dock; câmeras
  # multiespectrais Micasense/MAPIR; software de mapeamento) -- 178
  # produtos, catálogo inteiro relevante (sem filtro de marca, mesmo
  # padrão do jerdrones/premierdrones). Microdata igual aos outros "Loja
  # Integrada", sem seletor CSS

# ---- Scrapy (sitemap com fallback -- ver crawler/sitemap_utils.py) ----

agroshopbr:
  metodo: scrapy
  domain: https://agroshopbr.com
  filtro: [drone, "dji-", "-dji", agras]
  # Magento (não "Loja Integrada"). robots.txt não bloqueia bot nenhum, mas
  # disallowa "*cat=*" (bate com a URL de busca por categoria que motivou
  # mapear esse site -- não usar esse padrão de URL) e declara um Sitemap
  # de OUTRO domínio (agroshopacamargo.com.br) que só lista a home, sem
  # produto nenhum -- por isso `descobrir_sitemaps` (crawler/sitemap_utils.py)
  # agora também tenta o /sitemap.xml do próprio domínio como fonte extra
  # quando o declarado no robots.txt é diferente (achado real testando esse
  # site). Loja generalista agro (tratores, implementos) que também vende
  # a linha DJI Agras -- 21317 URLs no catálogo, 33 batem no filtro.
  # JSON-LD com bug real do lado do site ("offers" vem como lista com um
  # item vazio antes do Offer de verdade) -- corrigido em
  # crawler/extractors/structured.py (_first_dict), com teste de regressão

lojaododrone:
  metodo: scrapy
  domain: https://www.lojaododrone.com.br
  filtro: ["/p/"]
  # robots.txt permissivo (Allow: /, sem bloqueio de bot). Sitemap simples
  # (sem sitemapindex) mistura páginas institucionais (/about, /pricing,
  # /category/*) com produtos de verdade em /p/<slug> -- filtro restringe
  # só aos produtos. Loja especializada em drone agrícola (DJI Agras E
  # marca XAG, concorrente chinesa da DJI nesse nicho) -- 275 produtos,
  # catálogo inteiro relevante, sem filtro de marca (mesmo padrão do
  # jerdrones/premierdrones/dronedireto). JSON-LD limpo, sem seletor CSS

# ---- ItemList bulk (páginas com vários produtos cada, ex: catálogo por veículo) ----

paccini:
  metodo: itemlist_bulk
  domain: https://www.paccini.com.br
  filtro: ["veiculos/case", "veiculos/new-holland"]
  # plataforma FBits; páginas /veiculos/marca/modelo listam peças compatíveis
  # via ItemList no JSON-LD, com preço já embutido -- ~20% das páginas têm
  # produto, ~2.6 itens em média quando têm

fontanatratorpecas:
  metodo: scrapy
  domain: https://www.fontanatratorpecas.com.br
  # robots.txt permissivo (só bloqueia login/checkout/filtros de busca, sem
  # bloqueio de bot). Plataforma Magazord (React no front, mas HTML vem
  # pré-renderizado no servidor com JSON-LD completo -- sku/preço/brand
  # direto, sem precisar de seletor CSS apesar do site usar React+Tailwind).
  # sitemap.xml é um sitemapindex com 5 sub-sitemaps (produto/categorias/
  # blog/landing-pages/institucional); só o de produto importa (1826 URLs),
  # os outros (~118 URLs juntos) são visitados mas descartados sem custo
  # real -- price_spider já ignora página sem preço (ver "sem_preco" no
  # relatório de falhas). Loja generalista de peças agrícolas (não só CNH --
  # também Valtra/Valmet, Jacto), sem filtro de marca = catálogo inteiro.
  # sku do JSON-LD é o ID interno da loja (ex: "17947"), não o código do
  # fabricante que aparece no título (ex: "5117219") -- mesmo padrão já
  # visto nos sites VTEX (ver PLANO.md, investigação sku/mpn/codigo_peca);
  # mpn não é declarado aqui. Se quiser o código real, precisaria da mesma
  # heurística de extração por texto (_extrair_codigo_peca), hoje só
  # implementada pro fluxo VTEX.

dronesense:
  metodo: scrapy
  domain: https://www.dronesense.com.br
  filtro: ["/drones-agricolas/"]
  # robots.txt permissivo, sem bloqueio de bot. Site Astro (SSG) -- HTML já
  # vem pré-renderizado com JSON-LD Product completo, sku legível de
  # verdade (ex: "DJI-AGRAS-T25P", não um ID interno opaco -- diferente do
  # padrão VTEX/Magazord). Sitemap tem 747 URLs (maioria blog/calendário
  # agrícola por cultura+estado/institucional) -- filtro restringe às 6
  # páginas de produto (/drones-agricolas/dji-agras-<modelo>). Só T25P,
  # T70P e T100 têm preço público (kit fechado, venda direta); T25/T40/T50
  # são gerações anteriores descontinuadas (OutOfStock, sem preço) -- já
  # tratado normalmente pelo price_spider (ignora item sem preço). Sem
  # catálogo de peças avulsas à venda (as páginas /pecas/compatibilidade/
  # são só referência técnica, sem preço nenhum).

bamaqmaquinas:
  metodo: scrapy
  domain: https://loja.bamaqmaquinas.com.br
  filtro: [case, new-holland, newholland, cnh]
  # robots.txt totalmente permissivo (Allow: /, sem bloqueio de bot, sem
  # Crawl-delay). Plataforma Wake Commerce (ex-FBits, mesma família do
  # paccini) -- JSON-LD Product completo (sku/preço/marca/disponibilidade),
  # sem precisar de seletor CSS. Loja de peças de linha amarela/construção
  # CNH (retroescavadeiras, pás-carregadeiras), não agrícola -- catálogo
  # gigante: 16929 URLs de produto no sitemap, 14944 (88%) já batem o
  # filtro case/new-holland/cnh (quase tudo é CNH). Rodada grande, deve
  # levar bem mais de um dia no delay padrão do scrapy (parecido com
  # tratorlin/realtrator).

# ---- Bloqueados / pendentes (não rodar ainda -- ver PLANO.md) ----
# rohrmaquinas.com.br -- precisa Playwright (Fase 6)
# usaparts.com.br -- preço só visível com login, fora de escopo
# Mercado Livre -- API restrita a apps certificados + anti-bot no HTML (Fase 7)
